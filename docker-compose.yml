version: '3.8'

services:
  yupoo-downloader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yupoo-downloader
    restart: unless-stopped
    volumes:
      # Mapeia os arquivos de configuração e tokens para persistência
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - GOOGLE_CREDENTIALS=${GOOGLE_CREDENTIALS}
      - GOOGLE_TOKEN=${GOOGLE_TOKEN}
